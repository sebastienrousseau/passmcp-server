name: Bug report
description: A tool that misbehaved, a host that cannot talk to the server, or a result that is wrong or unsafe
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue — passmcp reaching a host that is not on the
        allowlist, a credential sent, a mutating tool invoked — **stop** and
        report it privately through
        [GitHub's private vulnerability reporting](https://github.com/sebastienrousseau/passmcp-server/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/sebastienrousseau/passmcp-server/blob/main/SECURITY.md).

        A finding passmcp got wrong about the server it evaluated belongs in
        [passmcp's issues](https://github.com/sebastienrousseau/passmcp/issues).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The tool call's arguments and the result, or the host's error. Paste them, not a summary.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versions
      description: What `passmcp_version` returned, or `passmcp-server --version` and `passmcp version`.
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: MCP host
      description: The host and its version, and whether passmcp-server runs as a binary or as the container image.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - WSL2
    validations:
      required: true
