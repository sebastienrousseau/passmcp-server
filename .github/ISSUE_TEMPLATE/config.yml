blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/sebastienrousseau/passmcp-server/security/advisories/new
    about: Report privately. Do not open a public issue for a security problem.
  - name: Question or idea
    url: https://github.com/sebastienrousseau/passmcp-server/discussions
    about: For anything that is not a bug report or a concrete feature request.
  - name: A verdict passmcp got wrong
    url: https://github.com/sebastienrousseau/passmcp/issues/new/choose
    about: passmcp-server relays passmcp's report; a wrong finding is passmcp's to fix.
