site_name: passmcp-server
site_description: An MCP server exposing passmcp's diagnostics as read-only tools.
site_url: https://sebastienrousseau.com/passmcp-server/
copyright: '&copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>'
repo_url: https://github.com/sebastienrousseau/passmcp-server
repo_name: sebastienrousseau/passmcp-server
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: public
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Comparison: COMPARISON.md
  - Benchmarks: BENCHMARKS.md
  - Publishing to the registry: publishing.md
  - Decision records:
      - adr/README.md
      - adr/0001-run-passmcp-as-a-program.md
      - adr/0002-loopback-only-allowlist.md
      - adr/0003-no-operator-configuration-credentials-or-mutations.md
      - adr/0004-version-in-lockstep-with-passmcp.md
  - Releases:
      - 0.0.4: releases/v0.0.4.md
      - 0.0.3: releases/v0.0.3.md
      - 0.0.2: releases/v0.0.2.md
      - 0.0.1: releases/v0.0.1.md
